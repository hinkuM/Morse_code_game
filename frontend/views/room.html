<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pokój</title>
   <link rel="stylesheet" href="assets/styles/css.css">
   <link rel="stylesheet" href="assets/styles/room.css">
   <link rel="stylesheet" href="assets/styles/crt_display.css">
   <link rel="stylesheet" href="assets/styles/paper.css">
   <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>

<body>
   <div id="start">
      Rozpocznij swoją przygodę
   </div>
   <div class="bezel">
      <div class="crt-wrap">
         <div class="crt fx-scanlines fx-roll fx-noise fx-vignette  fx-blur fx-curve crt-off" id="screen">
            <div id="content">
            </div>
            <div class="layer layer--scanlines"></div>
            <div class="layer layer--roll"></div>
            <div class="layer layer--vignette"></div>
         </div>
         <div class="afterglow" id="afterglow"></div>
      </div>
   </div>
   <div class="paper">
      <div class="tape"></div>
      <h3>STEROWANIE</h3>
      <p>Enter - zatwierdź</p>
      <p>Backspace - usuń</p>
      <p>Spacja - wyślij sygnał</p>
   </div>

   <script type="module" src="assets/modules/room.js"></script>
</body>

</html>
